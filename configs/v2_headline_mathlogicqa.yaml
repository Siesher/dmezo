# D-MeZO-N v2 headline recipe — reproduces docs/multiseed_analysis.md §22
# (loss 1.2926±0.0102 vs vanilla 1.3681±0.0182, 3 seeds paired)
#
# IMPORTANT: scripts/local_test_improvements.py does NOT accept --config yet.
# This file documents the exact CLI flags used for the §22 paper-scale run
# (Colab Blackwell, 2026-05-21, ~12h). Invoke as:
#
#   python scripts/local_test_improvements.py \
#       --model Qwen/Qwen3.5-4B-Base \
#       --task mathlogicqa \
#       --seeds 42 43 44 \
#       --variants vanilla dmezo_n dmezo_n_drift dmezo_n_adaptive_clip dmezo_n_combo \
#       --n-clients 4 \
#       --num-rounds 1000 \
#       --lr 3e-7 --eps 1e-3 \
#       --num-train-examples 500 --num-eval-examples 100 \
#       --batch-size 8 --max-length 256 \
#       --eval-every 100 --eval-batches 13 \
#       --dtype bfloat16 \
#       --rho-clip 50 --beta-start 0.9 --beta-end 0.0 \
#       --drift-window 50 --drift-threshold 0.1 \
#       --ac-window 50 --ac-quantile 0.95 --ac-alpha 1.3 \
#       --dp-sigma 0.5
#
# Field → CLI flag mapping (for when --config support is added):
#   model.name                → --model
#   data.seeds                → --seeds
#   data.task                 → --task
#   data.num_train_examples   → --num-train-examples
#   data.num_eval_examples    → --num-eval-examples
#   data.batch_size           → --batch-size
#   data.max_length           → --max-length
#   federated.num_clients     → --n-clients
#   federated.topology        → complete (fixed in this config)
#   federated.partition_mode  → iid (fixed in this config)
#   federated.consensus_mode  → --consensus-mode (weight_avg used; update_share+Nesterov is NotImplementedError)
#   train.num_rounds          → --num-rounds
#   train.eval_every          → --eval-every
#   train.eval_batches        → --eval-batches
#   mezo.lr                   → --lr
#   mezo.eps                  → --eps
#   mezo.rho_clip             → --rho-clip  (for vanilla/v1 variants; dmezo_n_combo overrides to None in code)
#   nesterov.beta_start       → --beta-start
#   nesterov.beta_end         → --beta-end    (linear decay 0.9 → 0.0 over num_rounds)
#   nesterov.look_ahead       → false (look-ahead disabled; NaN at R20 in experiments)
#   drift_reset.window        → --drift-window
#   drift_reset.threshold     → --drift-threshold
#   adaptive_clip.window      → --ac-window
#   adaptive_clip.quantile    → --ac-quantile
#   adaptive_clip.alpha       → --ac-alpha
#   dp.sigma                  → --dp-sigma   (only used by dmezo_n_dp variant)
#   dp.delta                  → --dp-delta

experiment_name: dmezo_n_v2_headline_mathlogicqa
variant: dmezo_n_combo  # D-MeZO-N v2 = B1 (adaptive clip) + B5 (drift-reset)
output_dir: experiments/22_v2_headline_mathlogicqa

model:
  name: Qwen/Qwen3.5-4B-Base
  dtype: bfloat16
  flash_attention: false  # FA2 not yet reliable on hybrid linear-attention layers

data:
  task: mathlogicqa
  seeds: [42, 43, 44]    # 3-seed paired validation
  batch_size: 8
  max_length: 256
  # MERA MathLogicQA: 680 labelled examples (test labels private).
  # 500 train / 4 clients IID → ~125 examples per client.
  # 100 eval examples → 13 eval batches of 8 (batch_size) covers the pool.
  num_train_examples: 500
  num_eval_examples: 100
  partition_mode: iid

mezo:
  lr: 3.0e-7
  eps: 1.0e-3
  weight_decay: 0.0
  # rho_clip is set here for vanilla/v1 variants.
  # For dmezo_n_combo, MeZOConfig is constructed with rho_clip=None —
  # the adaptive clip threshold is the effective bound (observed range C_t ∈ [132, 321]).
  rho_clip: 50.0

nesterov:
  enabled: true
  beta_start: 0.9
  beta_end: 0.0   # linear decay over num_rounds → β=0 at final round
  look_ahead: false

drift_reset:
  # B5: velocity-zeroing when eval_loss > rolling_min + threshold over last window rounds.
  # NOTE: script defaults differ (window=100, threshold=0.05).
  # Canonical §22 recipe uses window=50, threshold=0.1 (confirmed from
  # experiments/diagnostics/local_test_improvements_Qwen_Qwen3p5-4B-Base_mathlogicqa.json).
  window: 50
  threshold: 0.1

adaptive_clip:
  # B1: clips ρ at quantile(|ρ|, last window steps) * alpha.
  # Resolves fixed-C=50 over-clipping issue (median |ρ| ≈ 180 on Qwen3.5-4B-Base).
  window: 50
  quantile: 0.95
  alpha: 1.3

dp:
  # D2: only active for dmezo_n_dp variant; inactive for dmezo_n_combo.
  sigma: 0.5
  delta: 1.0e-3

federated:
  num_clients: 4
  topology: complete
  consensus_mode: weight_avg  # update_share + Nesterov is NotImplementedError (see docs/07-audit-harden.md D1)
  local_steps: 1

train:
  num_rounds: 1000
  eval_every: 100
  eval_batches: 13  # covers 100-example eval pool at batch_size=8 (ceil(100/8)=13)
  log_every: 100
