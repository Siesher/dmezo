<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="D-MeZO-N: Decentralized Federated MeZO with Nesterov Stabilization">
  <title>D-MeZO-N — Decentralized Federated MeZO with Nesterov Stabilization</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="60%" stop-color="#15163d"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A5B4FC"/>
      <stop offset="55%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="node-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <pattern id="grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#312e81" stroke-opacity="0.18" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>

  <!-- =========== LEFT PANEL: P2P graph =========== -->
  <g transform="translate(60, 70)">
    <text x="0" y="-22" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="2">PEER-TO-PEER · n = 4</text>

    <!-- Edges (doubly-stochastic W mixing) -->
    <g stroke="#818CF8" stroke-opacity="0.55" stroke-width="1.6" fill="none">
      <line x1="50"  y1="50"  x2="220" y2="50"/>
      <line x1="50"  y1="50"  x2="50"  y2="170"/>
      <line x1="50"  y1="50"  x2="220" y2="170"/>
      <line x1="220" y1="50"  x2="50"  y2="170"/>
      <line x1="220" y1="50"  x2="220" y2="170"/>
      <line x1="50"  y1="170" x2="220" y2="170"/>
    </g>

    <!-- Edge labels: 16 bytes -->
    <g font-family="JetBrains Mono, monospace" font-size="9" fill="#A5B4FC" fill-opacity="0.7">
      <text x="135" y="44" text-anchor="middle">(s, ρ)</text>
      <text x="135" y="183" text-anchor="middle">16 B</text>
    </g>

    <!-- Halo behind nodes -->
    <g>
      <circle cx="50"  cy="50"  r="32" fill="url(#node-glow)"/>
      <circle cx="220" cy="50"  r="32" fill="url(#node-glow)"/>
      <circle cx="50"  cy="170" r="32" fill="url(#node-glow)"/>
      <circle cx="220" cy="170" r="32" fill="url(#node-glow)"/>
    </g>

    <!-- Nodes (clients with independent z_i) -->
    <g font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" text-anchor="middle">
      <circle cx="50"  cy="50"  r="14" fill="#1e1b4b" stroke="#C4B5FD" stroke-width="2"/>
      <text   x="50"   y="54"   fill="#F1F5F9">z₁</text>

      <circle cx="220" cy="50"  r="14" fill="#1e1b4b" stroke="#A5B4FC" stroke-width="2"/>
      <text   x="220"  y="54"   fill="#F1F5F9">z₂</text>

      <circle cx="50"  cy="170" r="14" fill="#1e1b4b" stroke="#A5B4FC" stroke-width="2"/>
      <text   x="50"   y="174"  fill="#F1F5F9">z₃</text>

      <circle cx="220" cy="170" r="14" fill="#1e1b4b" stroke="#C4B5FD" stroke-width="2"/>
      <text   x="220"  y="174"  fill="#F1F5F9">z₄</text>
    </g>

    <!-- Caption -->
    <text x="135" y="215" text-anchor="middle" fill="#94A3B8" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="12">
      independent z_i  ⟹  1/n variance speedup
    </text>
  </g>

  <!-- =========== CENTER: Title =========== -->
  <g transform="translate(380, 0)">
    <!-- Title -->
    <text x="260" y="120" text-anchor="middle"
          font-family="Newsreader, Georgia, serif"
          font-size="76" font-weight="600" letter-spacing="-1"
          fill="url(#brand)">D-MeZO-N</text>

    <!-- Subtitle -->
    <text x="260" y="158" text-anchor="middle"
          font-family="Inter, system-ui, sans-serif"
          font-size="15" letter-spacing="2.4" font-weight="500"
          fill="#C4B5FD" fill-opacity="0.85">
      DECENTRALIZED · FEDERATED · NESTEROV-STABILIZED
    </text>

    <!-- MeZO core formula -->
    <g transform="translate(260, 210)" text-anchor="middle"
       font-family="Newsreader, Georgia, serif" fill="#E0E7FF" font-style="italic">
      <text x="-115" y="0" font-size="26">ĝ</text>
      <text x="-92"  y="0" font-size="26">=</text>
      <!-- Fraction -->
      <text x="0"    y="-12" font-size="22">L(θ+εz) − L(θ−εz)</text>
      <line x1="-104" y1="0" x2="104" y2="0" stroke="#A5B4FC" stroke-width="1.5"/>
      <text x="0"    y="20"  font-size="22">2ε</text>
      <text x="124"  y="0"  font-size="26">·</text>
      <text x="142"  y="0"  font-size="26">z</text>
    </g>

    <!-- Pill: theorem badge -->
    <g transform="translate(260, 262)">
      <rect x="-150" y="-16" width="300" height="32" rx="16"
            fill="#4F46E5" fill-opacity="0.16" stroke="#818CF8" stroke-opacity="0.55"/>
      <text x="0" y="5" text-anchor="middle"
            font-family="JetBrains Mono, monospace" font-size="12"
            fill="#C4B5FD" letter-spacing="1.2">
        T3 · closes Princeton Open Problem 1
      </text>
    </g>
  </g>

  <!-- =========== RIGHT PANEL: Lyapunov decay =========== -->
  <g transform="translate(940, 70)">
    <text x="0" y="-22" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="2">LYAPUNOV  Vₜ ↘  (1 − 3ημ/2)ᵀ</text>

    <!-- Plot area -->
    <rect x="0" y="0" width="280" height="180" fill="#0f1233" fill-opacity="0.55" rx="6" stroke="#312e81" stroke-opacity="0.5"/>

    <!-- Y axis -->
    <line x1="0" y1="0" x2="0" y2="180" stroke="#475569" stroke-width="1"/>
    <text x="-8" y="6"   fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="end">V₀</text>
    <text x="-8" y="180" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="end">0</text>

    <!-- X axis -->
    <line x1="0" y1="180" x2="280" y2="180" stroke="#475569" stroke-width="1"/>
    <text x="0"   y="200" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="10">0</text>
    <text x="280" y="200" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="end">T</text>

    <!-- Noise floor line -->
    <line x1="0" y1="148" x2="280" y2="148" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,4" stroke-opacity="0.55"/>
    <text x="285" y="152" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="10">2G²/3μ</text>

    <!-- Glow under curve -->
    <path d="M 0 6 C 70 6, 90 30, 130 80 S 220 142, 280 148 L 280 180 L 0 180 Z"
          fill="url(#curve)" fill-opacity="0.18"/>

    <!-- Decay curve -->
    <path d="M 0 6 C 70 6, 90 30, 130 80 S 220 142, 280 148"
          fill="none" stroke="url(#curve)" stroke-width="3" stroke-linecap="round"/>

    <!-- Vanilla MeZO baseline (slower) -->
    <path d="M 0 6 C 100 10, 150 40, 230 90 S 280 160, 280 165"
          fill="none" stroke="#64748B" stroke-width="1.6" stroke-dasharray="2,5" stroke-opacity="0.7"/>

    <!-- Legend -->
    <g font-family="Inter, system-ui, sans-serif" font-size="11">
      <line x1="155" y1="22" x2="173" y2="22" stroke="url(#curve)" stroke-width="3"/>
      <text x="178" y="26" fill="#C4B5FD">D-MeZO-N v2</text>
      <line x1="155" y1="40" x2="173" y2="40" stroke="#64748B" stroke-width="1.6" stroke-dasharray="2,5"/>
      <text x="178" y="44" fill="#94A3B8">vanilla MeZO</text>
    </g>
  </g>

  <!-- =========== Bottom credit strip =========== -->
  <g font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2">
    <text x="60"   y="305" fill="#64748B">FORWARD-ONLY · 16 BYTES/ROUND · (ε,δ)-DP</text>
    <text x="1220" y="305" text-anchor="end" fill="#64748B">github.com/Siesher/dmezo</text>
  </g>
</svg>
